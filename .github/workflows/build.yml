name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Specific Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Inject Drawables and Build APK
      working-directory: NeroDnsApp
      run: |
        # ساخت مطمئن پوشه drawable
        mkdir -p app/src/main/res/drawable

        # 1. ساخت خودکار آیکون برنامه ic_launcher.xml
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#0D0E15" android:pathData="M0,0h108v108h-108z"/>
            <path android:strokeColor="#7B2CBF" android:strokeWidth="3" android:fillColor="#1A102F"
                android:pathData="M54,18 A36,36 0 1,0 54,90 A36,36 0 1,0 54,18 Z"/>
            <path android:fillColor="#00F5D4"
                android:pathData="M54,30 L66,48 L56,48 L60,74 L42,54 L52,54 Z"/>
        </vector>
        EOF

        # 2. ساخت کارت شیشه‌ای glass_card.xml
        cat << 'EOF' > app/src/main/res/drawable/glass_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1AFFFFFF"/>
            <stroke android:width="1.5dp" android:color="#4D9D4EDD"/>
            <corners android:radius="24dp"/>
        </shape>
        EOF

        # 3. ساخت دکمه نئونی btn_neon.xml
        cat << 'EOF' > app/src/main/res/drawable/btn_neon.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:angle="45" android:startColor="#7209B7" android:endColor="#00F5D4"/>
            <corners android:radius="18dp"/>
        </shape>
        EOF

        # پاکسازی کاراکترهای BOM
        find . -type f \( -name "*.gradle" -o -name "*.java" -o -name "*.xml" -o -name "*.properties" \) -exec sed -i '1s/^\xEF\xBB\xBF//' {} +

        # شروع فرآیند بیلد
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NeroDNS-APK
        path: "NeroDnsApp/app/build/outputs/apk/debug/*.apk"
